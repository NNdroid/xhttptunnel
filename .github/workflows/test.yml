name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit, integration, CDN, delay, TLS, and HTTP/3 tests
        run: go test ./... -count=1 -timeout=5m

  crossarch-32bit:
    name: "32-bit targets: compile, execute, benchmark"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Every other job only exercises the runner's own 64-bit word size, so a
    # 32-bit target could trap on an unaligned 64-bit atomic (or fail to compile
    # its tests) and still ship. linux/386 is the only 32-bit target this runner
    # can execute — the x86_64 kernel runs i386 binaries directly, and with
    # CGO_ENABLED=0 the test binary is statically linked, so no 32-bit libc is
    # needed — so it gets the full suite, the benchmark gate and profiles.
    # linux/arm needs qemu-user and the 32-bit windows target is a foreign OS,
    # so both get compile + vet + test-compile only. -race is unsupported on 386,
    # which is why the race job stays 64-bit.
    env:
      # Same regex and the same per-benchmark MIN method as benchmark-regression,
      # so the two gates measure the same thing rather than two different ones.
      # The threshold is wider than amd64's 1.25: the 32-bit runner is slower and
      # noisier, and a real regression still lifts the floor well past 1.50.
      BENCH_REGEX: 'Benchmark(XHTTPTunnel_(ThroughCDN_72KB|TCP_h[123]|UDP_h[123])|ReliableBuffer_.*)$'
      BENCH_THRESHOLD: '1.50'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve baseline ref
        id: base
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            ref="${{ github.event.pull_request.base.sha }}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            ref="${{ github.event.before }}"
          else
            ref="HEAD~1"
          fi
          zero="0000000000000000000000000000000000000000"
          if [ -z "$ref" ] || [ "$ref" = "$zero" ] || ! git cat-file -e "${ref}^{commit}" 2>/dev/null; then
            ref="HEAD~1"
          fi
          if git cat-file -e "${ref}^{commit}" 2>/dev/null; then
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          else
            echo "No reachable baseline (first commit / shallow clone); skipping the 32-bit gate." >> "$GITHUB_STEP_SUMMARY"
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile every 32-bit release target
        shell: bash
        run: |
          set -euo pipefail
          for target in linux/386 linux/arm windows/386; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build ./... \
              && echo "$os/$arch build OK"
          done

      - name: Vet and compile the test packages that cannot run here
        shell: bash
        run: |
          set -euo pipefail
          for target in linux/arm windows/386; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go vet ./...
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go test -c -o /dev/null .
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go test -c -o /dev/null ./tunnel
            echo "$os/$arch vet + test-compile OK"
          done

      - name: Verify this runner can execute 32-bit binaries
        shell: bash
        run: |
          set -euo pipefail
          # Everything after this step depends on the kernel running i386
          # binaries (CONFIG_IA32_EMULATION). If the runner image ever changes
          # that, fail here with a clear diagnosis instead of surfacing it later
          # as a mysterious "exec format error" inside the test suite.
          printf 'package main\nfunc main() {}\n' > probe.go
          CGO_ENABLED=0 GOOS=linux GOARCH=386 go build -o probe386 probe.go
          if ! ./probe386; then
            echo "::error::linux/386 binaries cannot execute on this runner." >> "$GITHUB_STEP_SUMMARY"
            uname -a >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "linux/386 execution confirmed"
          rm -f probe.go probe386

      - name: Run the full suite natively on linux/386
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=386 go test ./... -count=1 -timeout=10m

      - name: Benchmark 32-bit HEAD and baseline, then compare
        if: steps.base.outputs.ref != ''
        shell: bash
        run: |
          set -euo pipefail
          export CGO_ENABLED=0 GOOS=linux GOARCH=386
          go test ./... -run '^$' -bench "$BENCH_REGEX" -benchmem -benchtime=100ms -count=8 | tee new32.txt
          git worktree add --detach ../bench-base32 "${{ steps.base.outputs.ref }}"
          ( cd ../bench-base32 && CGO_ENABLED=0 GOOS=linux GOARCH=386 \
              go test ./... -run '^$' -bench "$BENCH_REGEX" -benchmem -benchtime=100ms -count=8 ) > base32.txt
          # benchstat and bench_gate are host tools; dropping the 32-bit env
          # avoids cross-compiling benchstat just to run it.
          unset GOOS GOARCH
          go run golang.org/x/perf/cmd/benchstat@latest base32.txt new32.txt | tee benchstat32.txt
          { echo '### 32-bit benchmark comparison (baseline → HEAD, linux/386)'; echo ''; echo '```'; cat benchstat32.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/bench_gate.py base32.txt new32.txt --threshold "$BENCH_THRESHOLD"

      - name: Capture CPU profiles per transport on linux/386
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p profiles32
          export CGO_ENABLED=0 GOOS=linux GOARCH=386
          declare -A BENCHS=(
            [h1]='BenchmarkXHTTPTunnel_TCP_h1$'
            [h2]='BenchmarkXHTTPTunnel_TCP_h2$'
            [h3]='BenchmarkXHTTPTunnel_TCP_h3$'
            [cdn]='BenchmarkXHTTPTunnel_ThroughCDN_72KB$'
          )
          for label in h1 h2 h3 cdn; do
            go test ./tunnel/ -run '^$' -bench "${BENCHS[$label]}" -benchmem \
              -benchtime=3s -count=1 \
              -cpuprofile "profiles32/cpu-${label}.out"
          done
          # pprof -top reads the profile text directly and never executes the
          # binary, so it works on a foreign-architecture profile. SVG rendering
          # needs graphviz and is skipped here on purpose.
          {
            echo '### 32-bit CPU top (flat), linux/386'
            echo ''
            for label in h1 h2 h3 cdn; do
              echo "<details><summary>${label}</summary>"
              echo ''
              echo '```'
              go tool pprof -top -nodecount=12 "profiles32/cpu-${label}.out" 2>/dev/null || true
              echo '```'
              echo '</details>'
              echo ''
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload 32-bit benchmark and profile data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 32bit-bench-${{ github.sha }}
          path: |
            base32.txt
            new32.txt
            benchstat32.txt
            profiles32/
          if-no-files-found: warn
          retention-days: 14

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        shell: bash
        run: |
          mapfile -t go_files < <(git ls-files '*.go')
          unformatted="$(gofmt -l "${go_files[@]}")"
          if [[ -n "${unformatted}" ]]; then
            echo "The following files need gofmt:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi

  race-and-network-stress:
    name: Race and repeated delay tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race ./... -count=1 -timeout=10m

      - name: Repeat the delayed CDN test
        run: go test ./... -run '^TestXHTTPTunnel_E2E_ThroughCDNWithLatency$' -count=3 -timeout=3m

  benchmark-regression:
    name: Benchmark regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BENCH_REGEX: 'Benchmark(XHTTPTunnel_(ThroughCDN_72KB|TCP_h[123]|UDP_h[123])|ReliableBuffer_.*)$'
      # Fail when a benchmark's MINIMUM ns/op grows beyond this ratio vs the
      # baseline. The gate compares the per-benchmark floor (robust to shared-
      # runner GC/scheduler spikes that inflate the mean) — a real regression
      # lifts the floor too, so it is still caught. 1.25 is meaningful on min.
      BENCH_THRESHOLD: '1.25'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve baseline ref
        id: base
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            ref="${{ github.event.pull_request.base.sha }}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            ref="${{ github.event.before }}"
          else
            ref="HEAD~1"
          fi
          zero="0000000000000000000000000000000000000000"
          if [ -z "$ref" ] || [ "$ref" = "$zero" ] || ! git cat-file -e "${ref}^{commit}" 2>/dev/null; then
            ref="HEAD~1"
          fi
          if git cat-file -e "${ref}^{commit}" 2>/dev/null; then
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          else
            echo "No reachable baseline (first commit / shallow clone); skipping gate." >> "$GITHUB_STEP_SUMMARY"
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Benchmark current HEAD
        if: steps.base.outputs.ref != ''
        run: go test ./... -run '^$' -bench "$BENCH_REGEX" -benchmem -benchtime=100ms -count=8 | tee new.txt

      - name: Benchmark baseline
        if: steps.base.outputs.ref != ''
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach ../bench-base "${{ steps.base.outputs.ref }}"
          ( cd ../bench-base && go test ./... -run '^$' -bench "$BENCH_REGEX" -benchmem -benchtime=100ms -count=8 ) > base.txt

      - name: Compare with benchstat
        if: steps.base.outputs.ref != ''
        shell: bash
        run: |
          set -euo pipefail
          go run golang.org/x/perf/cmd/benchstat@latest base.txt new.txt | tee benchstat.txt
          { echo '### Benchmark comparison (baseline → HEAD)'; echo '```'; cat benchstat.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on regression
        if: steps.base.outputs.ref != ''
        run: python3 scripts/bench_gate.py base.txt new.txt --threshold "$BENCH_THRESHOLD"

  profiling:
    name: pprof / flamegraph profiles (h1/h2/h3 throughput)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Informational only: profile artifacts never gate the build, so a
    # graphviz hiccup cannot redden CI.
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install graphviz (for pprof SVG rendering)
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Capture CPU, block and memory profiles per transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p profiles
          # -benchtime generous enough to accumulate meaningful samples; block
          # profiling rate is enabled automatically by -blockprofile. ThroughCDN
          # is included because the CDN downlink (ack cadence / buffering) was
          # the original throughput pain point, not just raw transport speed.
          declare -A BENCHS=(
            [h1]='BenchmarkXHTTPTunnel_TCP_h1$'
            [h2]='BenchmarkXHTTPTunnel_TCP_h2$'
            [h3]='BenchmarkXHTTPTunnel_TCP_h3$'
            [cdn]='BenchmarkXHTTPTunnel_ThroughCDN_72KB$'
          )
          for label in h1 h2 h3 cdn; do
            go test ./tunnel/ -run '^$' \
              -bench "${BENCHS[$label]}" -benchmem \
              -benchtime=3s -count=1 \
              -cpuprofile "profiles/cpu-${label}.out" \
              -blockprofile "profiles/block-${label}.out" \
              -memprofile  "profiles/mem-${label}.out"
          done

      - name: Render SVG call graphs and summary tables
        shell: bash
        run: |
          set -uo pipefail
          {
            echo '### Transport profiles — CPU top (flat)'
            echo ''
            for label in h1 h2 h3 cdn; do
              echo "<details><summary>${label} (cpu)</summary>"
              echo ''
              echo '```'
              go tool pprof -top -nodecount=12 "profiles/cpu-${label}.out" 2>/dev/null || true
              echo '```'
              echo ''
              echo 'Block waits (where goroutines stall — flow control, reads, locks):'
              echo ''
              echo '```'
              go tool pprof -top -nodecount=12 "profiles/block-${label}.out" 2>/dev/null || true
              echo '```'
              echo '</details>'
              echo ''
            done
            echo 'Open any raw profile locally for an interactive flamegraph:'
            echo '`go tool pprof -http=. profiles/cpu-h2.out`'
          } >> "$GITHUB_STEP_SUMMARY"
          # SVG rendering is best-effort (needs graphviz); the raw .out files
          # are always uploaded and are the canonical flamegraph source.
          for label in h1 h2 h3 cdn; do
            go tool pprof -svg "profiles/cpu-${label}.out"   > "profiles/cpu-${label}.svg"   2>/dev/null || true
            go tool pprof -svg "profiles/block-${label}.out" > "profiles/block-${label}.svg" 2>/dev/null || true
            go tool pprof -svg "profiles/mem-${label}.out"   > "profiles/mem-${label}.svg"   2>/dev/null || true
          done

      - name: Upload profile artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profiles-${{ github.sha }}
          path: profiles/
          if-no-files-found: warn
          retention-days: 14
